name: 测试与构建守卫

# F6：让 tests/ 的全部守卫在 push/PR 时自动执法。
# 日更机器人用 GITHUB_TOKEN 推送的提交不会触发 push/PR（GitHub 防递归），
# 因此人类改动即时执法；机器人提交的数据契约漂移由每周一的 schedule 补盲（见 on.schedule）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # N1：日更机器人用 GITHUB_TOKEN 推送不触发任何 workflow（GitHub 防递归），
    # 而快照提交恰好改动看板静态导入的 data/*.json——契约漂移会静默入库。
    # 每周一 UTC 04:00 全量守卫补盲；04:00 避开日更 00:30/12:30 两个班次及其调度延迟窗口。
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python 守卫
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || {
            echo "::warning::requirements.txt 解析失败，回退核心四件（测试不依赖 akshare）"
            pip install requests pandas numpy PyYAML
          }

      - name: 依赖方向守卫（F2）
        run: python tests/run_dep_direction_test.py

      - name: M0 回归
        run: python tests/run_m0_regression.py

      - name: M1 guard 纪律测试
        run: python tests/run_m1_guard_test.py

      - name: P0 guard 对抗测试
        run: python tests/run_p0_guard_adversarial.py

      - name: T1 双 cron 幂等测试（E6）
        run: python tests/run_t1_streak_test.py

      - name: 文档一致性守卫
        run: python tests/run_docs_consistency_test.py

      - name: 快照契约守卫（N2）
        run: python tests/run_snapshot_contract_test.py

  dashboard-build:
    name: 看板构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 项目使用 pnpm（dashboard/pnpm-lock.yaml 入库）；setup-node 的 pnpm 缓存依赖它，故须先装 pnpm。
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: dashboard
        run: pnpm install --frozen-lockfile

      - name: 类型检查与构建
        working-directory: dashboard
        run: pnpm run build
