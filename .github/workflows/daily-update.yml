name: T1 无人值守日更（监控，不判定）

# T1 规则在点火前锁定；权威表述见 data/streak.json 的 rule 字段。
# UTC 00:30 / 12:30 两个时段各跑一次；任一完整成功即当日达标。
# 整个作业不判定、不改预算/修订/账本——只做数据新鲜度 + 降级披露。
on:
  schedule:
    - cron: "30 0 * * *"
    - cron: "30 12 * * *"
  push:
    paths:
      - ".github/workflows/daily-update.yml"
      - "tools/daily_update.py"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # E1 哈希链需完整历史：核对 last_commit_sha 是否仍在历史中

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || {
            echo "::warning::requirements.txt 安装失败，回退核心四件后单独重试 akshare"
            pip install requests pandas numpy pyyaml
            pip install akshare || echo "::warning::akshare 安装失败（滞后面将走降级路径）"
          }

      - name: 运行日更
        id: daily
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          # N3：仓库 Variables 优先，其次 Secrets（两者都支持，避免填错标签页时静默失效）
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO || secrets.OPENALEX_MAILTO }}
        run: python tools/daily_update.py

      - name: 提交快照（失败当日也提交，留痕可审计）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data || true
          git commit -m "日更快照 $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git push || echo "::warning::push 未完成"

      - name: 失败时开 issue（响亮失败）
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "T1 日更失败：$(date -u +%Y-%m-%d)" \
            --body "本次运行失败（run ${{ github.run_id }}）。按 T1 规则（当日无完整成功即计时归零、从头开始），请把本 issue 转告助手，不要自己抢修（抢修＝人工干预）。" \
            || true

      - name: 达成 30 天里程碑时开 issue（提醒人工收尾，防静默错过）
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STREAK=$(python -c "import json;print(json.load(open('data/streak.json'))['current_streak'])" || echo 0)
          TARGET=$(python -c "import json;print(json.load(open('data/streak.json'))['target_days'])" || echo 30)
          echo "streak=$STREAK target=$TARGET"
          if [ "$STREAK" -ge "$TARGET" ]; then
            COUNT=$(gh issue list --search "streak-milestone in:title" --state all --json number --jq length || echo 0)
            if [ "$COUNT" -eq 0 ]; then
              gh issue create \
                --title "T1 里程碑达成 streak-milestone：$STREAK/$TARGET 天连续无人值守运行" \
                --body "streak.json 计数达到 $STREAK/$TARGET（截至 $(date -u +%Y-%m-%dT%H:%MZ)）。达成触发两件人工事（按 T1 规则，属人工拍板动作，非抢修）：① 回填 GitHub 主页 Current Core；② 发布「30 天无人值守运行」短复盘。本 issue 为唯一张，重复运行不会重复开（按标题标记去重）。" \
                || true
            else
              echo "里程碑 issue 已存在，跳过"
            fi
          else
            echo "未达 $TARGET 天，不触发"
          fi

      # E5 外部心跳（D12）：补「根本没跑」的停机盲区。
      # healthchecks.io 建 check 后，把成功/失败两条 ping URL 填入仓库 Secrets：
      #   HEALTHCHECK_PING_URL（成功）/ HEALTHCHECK_FAIL_URL（失败）
      # 未配置时只 warning 跳过，不影响日更本身。
      - name: 外部心跳 · 成功（E5）
        if: success()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          if [ -z "$HC_URL" ]; then
            echo "::warning::HEALTHCHECK_PING_URL 未配置，跳过成功心跳"
            exit 0
          fi
          curl -fsS --retry 3 --max-time 10 "$HC_URL" || echo "::warning::成功心跳 ping 失败"

      - name: 外部心跳 · 失败（E5）
        if: failure()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_FAIL_URL }}
        run: |
          if [ -z "$HC_URL" ]; then
            echo "::warning::HEALTHCHECK_FAIL_URL 未配置，跳过失败心跳"
            exit 0
          fi
          curl -fsS --retry 3 --max-time 10 "$HC_URL" || echo "::warning::失败心跳 ping 失败"
