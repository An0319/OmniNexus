name: T1 无人值守日更（监控，不判定）

# T1 规则在点火前锁定；权威表述见 data/streak.json 的 rule 字段。
# UTC 00:30 / 12:30 两个时段各跑一次；任一完整成功即当日达标。
# 整个作业不判定、不改预算/修订/账本——只做数据新鲜度 + 降级披露。
on:
  schedule:
    - cron: "30 0 * * *"
    - cron: "30 12 * * *"
  push:
    paths:
      - ".github/workflows/daily-update.yml"
      - "tools/daily_update.py"
      # 流水线实际调用的脚本必须全部列在这里，否则改它们不会触发验证
      # （2026-11-27 漏过一次：改了 daily_sentinel.py 却没跑 CI）
      - "tools/daily_sentinel.py"
      - "tools/git_push_retry.py"
      - "tools/heartbeat_ping.py"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # E1 哈希链需完整历史：核对 last_commit_sha 是否仍在历史中

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || {
            echo "::warning::requirements.txt 安装失败，回退核心四件后单独重试 akshare"
            pip install requests pandas numpy pyyaml
            pip install akshare || echo "::warning::akshare 安装失败（滞后面将走降级路径）"
          }

      - name: 运行日更
        id: daily
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          # N3：仓库 Variables 优先，其次 Secrets（两者都支持，避免填错标签页时静默失效）
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO || secrets.OPENALEX_MAILTO }}
          # E9 运行态（架构审计 D13）：cron 槽位随 run_state.json 落盘，非 cron 触发记 adhoc
          RUN_SLOT: ${{ github.event.schedule || 'adhoc' }}
        run: python tools/daily_update.py

      # 旁路哨兵：专抓「跑成功了，数是空的」。三个检查——产物为空 / 连续降级满 30 天 /
      # 计时归零或倒退；报警 issue 标题带「[哨兵]」，与「T1 日更失败：」分开。
      # if: always() + continue-on-error：日更挂没挂都检查，哨兵自己崩了也不改日更结论。
      # 只写不验的监控等于没有监控——本地用 python tools/daily_sentinel.py --self-test 验过。
      # 放在「提交快照」之前：它写的 data/sentinel_report.json 由下一步一起提交，成为次日计数基线。
      - name: 旁路哨兵 · 沉默失败检查
        id: sentinel
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/daily_sentinel.py

      - name: 提交快照（失败当日也提交，留痕可审计）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "日更快照 $(date -u +%Y-%m-%dT%H:%MZ)"
          fi
          # 推不上去 = 当天数据永久丢失，必须真失败：重试 3 次（5/15/45s，含变基），
          # 全部失败则非零退出 → job 失败 → 成功心跳（if: success()）不会发。
          python tools/git_push_retry.py

      - name: 失败时开 issue（响亮失败）
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "T1 日更失败：$(date -u +%Y-%m-%d)" \
            --body "本次运行失败（run ${{ github.run_id }}）。按 T1 规则（当日无完整成功即计时归零、从头开始），请把本 issue 转告助手，不要自己抢修（抢修＝人工干预）。"

      - name: 达成 30 天里程碑时开 issue（提醒人工收尾，防静默错过）
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STREAK=$(python -c "import json;print(json.load(open('data/streak.json'))['current_streak'])" || echo 0)
          TARGET=$(python -c "import json;print(json.load(open('data/streak.json'))['target_days'])" || echo 30)
          echo "streak=$STREAK target=$TARGET"
          if [ "$STREAK" -ge "$TARGET" ]; then
            COUNT=$(gh issue list --search "streak-milestone in:title" --state all --json number --jq length || echo 0)
            if [ "$COUNT" -eq 0 ]; then
              gh issue create \
                --title "T1 里程碑达成 streak-milestone：$STREAK/$TARGET 天连续无人值守运行" \
                --body "streak.json 计数达到 $STREAK/$TARGET（截至 $(date -u +%Y-%m-%dT%H:%MZ)）。达成触发两件人工事（按 T1 规则，属人工拍板动作，非抢修）：① 回填 GitHub 主页 Current Core；② 发布「30 天无人值守运行」短复盘。本 issue 为唯一张，重复运行不会重复开（按标题标记去重）。"
            else
              echo "里程碑 issue 已存在，跳过"
            fi
          else
            echo "未达 $TARGET 天，不触发"
          fi

      # E5 外部心跳（D12）：补「根本没跑」的停机盲区。
      # healthchecks.io 建 check 后，把成功/失败两条 ping URL 填入仓库 Secrets：
      #   HEALTHCHECK_PING_URL（成功）/ HEALTHCHECK_FAIL_URL（失败）
      # 心跳失败不在这里喊（嗓子坏了喊不出来），而是写进 data/heartbeat_state.json，
      # 由下一次运行的哨兵读出来开 issue。脚本恒返回 0，不影响日更结论。
      - name: 外部心跳 · 成功（E5）
        if: success()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: python tools/heartbeat_ping.py --url "$HC_URL" --kind success

      - name: 外部心跳 · 失败（E5）
        if: failure()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_FAIL_URL }}
        run: python tools/heartbeat_ping.py --url "$HC_URL" --kind failure

      # 心跳留痕要入库才能被下一次运行读到。这一步只推一个 trace 文件，
      # 不是产出数据，所以允许「标红但不连坐」：continue-on-error + 显式 warning。
      - name: 提交心跳留痕（供下次运行汇报）
        if: always()
        continue-on-error: true
        run: |
          git add data/heartbeat_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no heartbeat state changes"
          else
            git commit -m "心跳留痕 $(date -u +%Y-%m-%dT%H:%MZ)"
            python tools/git_push_retry.py || echo "::warning::心跳留痕未推上去，下次运行看不到本次心跳结果"
          fi
