  lag_range: [0, 2]
  pass_window: [1, 2]       # k=0 只作前视诊断：A股当周收盘早于美股当周收盘，不可交易化
  pass_corr: 0.3
  noise_band: 0.19          # 描述性「弱信号」带，不再决定"无传导"判定
  null_median: 0.084        # 「无传导」判据线 = chain20 专属零分布（3 滞后位）旋转法中位
