[package]
name = "mnx-shell"
version = "0.1.0"
edition = "2021"
description = "OmniNexus 桌面壳（F 片）：只做进程搬运，不做状态判定"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
